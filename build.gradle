/*
 * Tinkers Construct
 * Master build file
 * Migrated to NeoForge
 * Authors: boni, Sunstrike, ProgWML6
 * Help from AbrarSyed
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'io.freefair.lombok' version '9.2.0'
}

repositories {
    mavenCentral()
    maven { // Mantle
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven { // JEI
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven {
        name "Parchment"
        url 'https://maven.parchmentmc.org'
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Local Mantle-NeoForge build
    flatDir {
        dir '../Mantle-NeoForge/build/libs'
    }
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${System.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

def modernDataPackDir = layout.buildDirectory.dir('generated/modernResources/main')

sourceSets.main {
    java {
        // Exclude third-party mod integration plugins that are not available as compile dependencies.
        // These plugins are compile-optional: they only load at runtime when the target mod is present.
        // Add them back (and add the mod as a compileOnly dependency) when the mod is available for NeoForge 1.21.1.
        exclude 'slimeknights/tconstruct/plugin/craftingtweaks/**'
        exclude 'slimeknights/tconstruct/plugin/jsonthings/**'
        exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
        exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
        exclude 'slimeknights/tconstruct/plugin/DummmmmmyPlugin.java'
    }
    resources {
        srcDir 'src/generated/resources'
        srcDir modernDataPackDir
        // But exclude the cache of the generated data from what gets built
        exclude '.cache'
        // Exclude debug resources, they are for helping us make the mod, not for the actual mod
        exclude 'assets/tconstruct/debug'
    }
}

tasks.register('syncModernDataPackPaths', Sync) {
    into(modernDataPackDir)

    from('src/main/resources') {
        include 'data/*/recipes/**'
        eachFile { fileCopyDetails ->
            fileCopyDetails.path = fileCopyDetails.path.replace('/recipes/', '/recipe/')
        }
        includeEmptyDirs = false
    }

    from('src/generated/resources') {
        include 'data/*/recipes/**'
        eachFile { fileCopyDetails ->
            fileCopyDetails.path = fileCopyDetails.path.replace('/recipes/', '/recipe/')
        }
        includeEmptyDirs = false
    }

    doLast {
        def normalizeJson
        normalizeJson = { node, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                boolean outputTagContext = path.any { it in ['result', 'results', 'output', 'outputs'] }
                boolean conditionTagContext = path.contains('conditions')
                node.replaceAll { key, value ->
                    if (key == 'tag' && !fluidTagContext && !outputTagContext && !conditionTagContext && value instanceof String && value.startsWith('forge:')) {
                        return 'c:' + value.substring('forge:'.length())
                    }
                    return normalizeJson(value, path + key.toString())
                }

                return node
            }
            if (node instanceof List) {
                return node.collect { value -> normalizeJson(value, path) }
            }
            return node
        }

        def collectForgeItemTags
        collectForgeItemTags = { node, Set<String> tags, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                boolean outputTagContext = path.any { it in ['result', 'results', 'output', 'outputs'] }
                boolean conditionTagContext = path.contains('conditions')
                node.each { key, value ->
                    if (key == 'tag' && !fluidTagContext && (outputTagContext || conditionTagContext) && value instanceof String && value.startsWith('forge:')) {
                        tags.add(value)
                    }
                    collectForgeItemTags(value, tags, path + key.toString())
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectForgeItemTags(value, tags, path) }
            }
        }

        def collectCommonItemTags
        collectCommonItemTags = { node, Set<String> tags, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                boolean outputTagContext = path.any { it in ['result', 'results', 'output', 'outputs'] }
                boolean conditionTagContext = path.contains('conditions')
                node.each { key, value ->
                    if (key == 'tag' && !fluidTagContext && !outputTagContext && !conditionTagContext && value instanceof String && value.startsWith('c:')) {
                        tags.add(value)
                    }
                    collectCommonItemTags(value, tags, path + key.toString())
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectCommonItemTags(value, tags, path) }
            }
        }

        def findExistingTagFile
        findExistingTagFile = { String namespace, String registry, String tagPath ->
            List<File> candidates = [
                file("src/main/resources/data/${namespace}/tags/${registry}/${tagPath}.json"),
                file("src/generated/resources/data/${namespace}/tags/${registry}/${tagPath}.json")
            ]
            candidates.find { it.exists() }
        }

        def collectTagChildren
        collectTagChildren = { String namespace, String registry, String tagPath ->
            Set<String> children = new TreeSet<>()
            [
                file("src/main/resources/data/${namespace}/tags/${registry}/${tagPath}"),
                file("src/generated/resources/data/${namespace}/tags/${registry}/${tagPath}")
            ].each { File directory ->
                if (directory.exists() && directory.isDirectory()) {
                    fileTree(directory) {
                        include '**/*.json'
                    }.files.each { File child ->
                        String relativePath = directory.toPath().relativize(child.toPath()).toString().replace('\\', '/')
                        children.add(relativePath.substring(0, relativePath.length() - '.json'.length()))
                    }
                }
            }
            children
        }

        def readTagValues
        readTagValues = { File tagFile ->
            if (tagFile == null || !tagFile.exists()) {
                return null
            }
            def parsed = new groovy.json.JsonSlurper().parse(tagFile)
            if (!(parsed instanceof Map) || !(parsed.values instanceof List)) {
                return null
            }
            [
                replace: parsed.replace == true,
                values : new ArrayList<>(parsed.values.collect { it.toString() })
            ]
        }

        def synthesizeCommonItemTag
        synthesizeCommonItemTag = { String tagPath ->
            Set<String> values = new LinkedHashSet<>()

            collectTagChildren('forge', 'item', tagPath).each { String child ->
                values.add("#forge:${tagPath}/${child}")
            }

            if (values.isEmpty()) {
                File forgeBlockTag = findExistingTagFile('forge', 'block', tagPath)
                def parsedBlockTag = readTagValues(forgeBlockTag)
                if (parsedBlockTag != null) {
                    values.addAll(parsedBlockTag.values)
                }
            }

            if (values.isEmpty()) {
                switch (tagPath) {
                    case 'cobblestone':
                        values.add('minecraft:cobblestone')
                        values.add('minecraft:mossy_cobblestone')
                        break
                }
            }

            if (values.isEmpty()) {
                return null
            }

            [
                replace: false,
                values : new ArrayList<>(values)
            ]
        }

        Set<String> missingForgeItemTags = new LinkedHashSet<>()
        Set<String> missingCommonItemTags = new LinkedHashSet<>()

        fileTree(modernDataPackDir.get().asFile) {
            include 'data/*/recipe/**/*.json'
        }.each { File recipeFile ->
            def json = new groovy.json.JsonSlurper().parse(recipeFile)
            def normalizedJson = normalizeJson(json)
            def vanillaResultTypes = [
                'minecraft:crafting_shaped',
                'minecraft:crafting_shapeless',
                'minecraft:smelting',
                'minecraft:blasting',
                'minecraft:smoking',
                'minecraft:campfire_cooking',
                'minecraft:stonecutting'
            ] as Set
            def retexturedCraftingTypes = [
                'mantle:crafting_shaped_retextured'
            ] as Set
            if (normalizedJson instanceof Map && normalizedJson.type in vanillaResultTypes) {
                if (normalizedJson.result instanceof String) {
                    def normalizedResult = [id: normalizedJson.result]
                    if (normalizedJson.count instanceof Number) {
                        normalizedResult.count = normalizedJson.remove('count')
                    }
                    normalizedJson.result = normalizedResult
                } else if (normalizedJson.result instanceof Map && normalizedJson.result.item != null && normalizedJson.result.id == null) {
                    normalizedJson.result.id = normalizedJson.result.remove('item')
                }
            }
            if (normalizedJson instanceof Map && normalizedJson.type in retexturedCraftingTypes) {
                if (normalizedJson.result instanceof Map && normalizedJson.result.item != null && normalizedJson.result.id == null) {
                    normalizedJson.result.id = normalizedJson.result.remove('item')
                }
                if (normalizedJson.texture instanceof String && normalizedJson.key instanceof Map) {
                    def textureKey = normalizedJson.texture
                    def textureIngredient = normalizedJson.key[textureKey]
                    if (textureIngredient instanceof Map) {
                        normalizedJson.texture = textureIngredient
                    }
                }
            }
            if (normalizedJson instanceof Map && normalizedJson.type instanceof String && normalizedJson.type.startsWith('tconstruct:') && normalizedJson.id == null) {
                def relativePath = modernDataPackDir.get().asFile.toPath().relativize(recipeFile.toPath()).toString().replace('\\', '/')
                def matcher = relativePath =~ /^data\/([^\/]+)\/recipe\/(.+)\.json$/
                if (matcher.matches()) {
                    normalizedJson.id = "${matcher.group(1)}:${matcher.group(2)}"
                }
            }
            collectForgeItemTags(normalizedJson, missingForgeItemTags)
            collectCommonItemTags(normalizedJson, missingCommonItemTags)
            if (normalizedJson != json || json instanceof Map) {
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(normalizedJson))
            } else if (json instanceof Map && json.result instanceof Map && json.result.item != null && json.result.id == null) {
                json.result.id = json.result.remove('item')
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            }
        }

        missingForgeItemTags.each { String forgeTag ->
            String tagPath = forgeTag.substring('forge:'.length())
            File sourceTag = file("src/main/resources/data/forge/tags/item/${tagPath}.json")
            File generatedTag = file("src/generated/resources/data/forge/tags/item/${tagPath}.json")
            if (sourceTag.exists() || generatedTag.exists()) {
                return
            }

            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/forge/tags/item/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            Map<String,Object> bridgeJson = [
                replace: false,
                values : ["#c:${tagPath}"]
            ]
            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bridgeJson))
        }

        missingCommonItemTags.each { String commonTag ->
            String tagPath = commonTag.substring('c:'.length())
            File sourceTag = file("src/main/resources/data/c/tags/item/${tagPath}.json")
            File generatedTag = file("src/generated/resources/data/c/tags/item/${tagPath}.json")
            if (sourceTag.exists() || generatedTag.exists()) {
                return
            }

            File sourceForgeTag = file("src/main/resources/data/forge/tags/item/${tagPath}.json")
            File generatedForgeTag = file("src/generated/resources/data/forge/tags/item/${tagPath}.json")
            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/c/tags/item/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            Map<String,Object> bridgeJson
            if (sourceForgeTag.exists() || generatedForgeTag.exists()) {
                bridgeJson = [
                    replace: false,
                    values : ["#forge:${tagPath}"]
                ]
            } else {
                bridgeJson = synthesizeCommonItemTag(tagPath)
                if (bridgeJson == null) {
                    return
                }
            }
            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bridgeJson))
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    accessTransformers {
        publish(file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            // MC account args
            if (project.hasProperty('mc_uuid')) {
                programArguments.addAll('--uuid', project.getProperty('mc_uuid'))
            }
            if (project.hasProperty('mc_username')) {
                programArguments.addAll('--username', project.getProperty('mc_username'))
            }
            if (project.hasProperty('mc_accessToken')) {
                programArguments.addAll('--accessToken', project.getProperty('mc_accessToken'))
            }
        }

        server {
            server()
            programArguments.add('--nogui')
        }

        data {
            data()
            programArguments.addAll('--mod', 'tconstruct', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath(),
                '--existing-mod', 'mantle')
        }
    }

    mods {
        tconstruct {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods.tconstruct
        enable()
    }
}

dependencies {
    // Mantle dependency - use local build from Mantle-NeoForge
    implementation fileTree(dir: '../Mantle-NeoForge/build/libs', include: 'Mantle-*.jar')

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('syncModernDataPackPaths')
    var replaceProperties = [
        'version': artifact_version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neoforge_range': neoforge_range,
        'mantle_range': mantle_range,
        'jei_range': jei_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach {
    dependsOn tasks.named('syncModernDataPackPaths')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Tinkers Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    dependsOn tasks.named('syncModernDataPackPaths')
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
