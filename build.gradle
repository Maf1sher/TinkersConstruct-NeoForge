plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    flatDir {
        dir '../Mantle-NeoForge/build/libs'
    }
    mavenCentral()
    maven {
        name 'NeoForge Maven'
        url 'https://maven.neoforged.net/releases'
    }
    maven {
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven {
        name 'Curse Maven'
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}

def revision = 'gitgud'
try {
    def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, projectDir)
    proc.waitFor()
    if (proc.exitValue() == 0) {
        revision = proc.text.trim()
    } else {
        revision = 'GITBORK'
    }
} catch (Exception ignored) {
    revision = 'gitgud'
}

def buildNumber = System.getenv('BUILD_NUMBER') ?: "DEV.${revision}"
ext.artifact_version = System.getenv('ARTIFACT_VERSION') ?: "${mod_version}.${buildNumber}"
version = "${minecraft_version}-${artifact_version}"

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}, Version: ${version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '.cache'
            exclude 'assets/tconstruct/debug'
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neoforge_version
    parchment {
        mappingsVersion = parchment_version
        minecraftVersion = parchment_minecraft_version
    }
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true
    addModdingDependenciesTo(sourceSets.test)

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            if (project.hasProperty('mc_uuid')) {
                programArgument '--uuid'
                programArgument project.property('mc_uuid')
            }
            if (project.hasProperty('mc_username')) {
                programArgument '--username'
                programArgument project.property('mc_username')
            }
            if (project.hasProperty('mc_accessToken')) {
                programArgument '--accessToken'
                programArgument project.property('mc_accessToken')
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', 'tconstruct', '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath, '--existing-mod', 'mantle'
        }
    }

    mods {
        create('tconstruct') {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${minecraft_version}-${ie_version}"
    runtimeOnly "curse.maven:selene-499980:${moonlight_file_id}"
    implementation "curse.maven:MmmMmmMmmMmm-225738:${dummy_file_id}"
    compileOnly "curse.maven:crafting-tweaks-233071:${crafting_tweaks_file_id}"
    compileOnly "curse.maven:balm-531761:${balm_file_id}"
    compileOnly "curse.maven:json-things-541617:${json_things_file_id}"

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        version: artifact_version,
        loader_range: loader_range,
        minecraft_range: minecraft_range,
        neoforge_range: neoforge_range,
        mantle_range: mantle_range,
        jei_range: jei_range,
        json_things_range: json_things_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Tinkers Construct',
            'Specification-Vendor': 'Slime Knights',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor': 'Slime Knights',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('sourcesJar', Jar).configure {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = uri(DEPLOY_DIR) }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
